name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test transactional writer, selection, mixed values, lifecycle, parsing and parameter schema
        run: dotnet test tests/AcadPaletteSetXData.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests --blame-hang-timeout 2m
      - name: Validate the example parameter schema and the stage 10 load schema
        run: |
          dotnet run --project experiments/AcadPaletteSetXData.SchemaCheck -c Release -- examples/schema.json
          dotnet run --project experiments/AcadPaletteSetXData.SchemaCheck -c Release -- examples/tzxdata-stage10-load-schema.json
      - name: Load report of 1000 objects × 50 parameters (TZXDATA 10.6)
        timeout-minutes: 3
        run: dotnet run --project experiments/AcadPaletteSetXData.LoadReport -c Release -- examples/tzxdata-stage10-load-schema.json
      - name: Migrate the stage 3 and stage 9 samples twice and check the drawing (VELEC_MIGRATE, VELEC_CHECK)
        run: |
          dotnet run --project experiments/AcadPaletteSetXData.MigrationReport -c Release -- examples/schema.json
          dotnet run --project experiments/AcadPaletteSetXData.MigrationReport -c Release -- --remove examples/schema.json
      - name: Test plugin load announcement and deferred startup
        run: dotnet test tests/AcadPaletteSetXData.AutoCAD.Tests -c Release --logger "trx;LogFileName=autocad.trx" --results-directory artifacts/tests --blame-hang-timeout 2m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: artifacts/tests

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build AutoCAD 2021 (.NET Framework 4.8) and AutoCAD 2025 (.NET 8) plugin
        run: dotnet build src/AcadPaletteSetXData.AutoCAD -c Release
      - name: Verify the optional AutoCAD 2024 API build
        run: dotnet build src/AcadPaletteSetXData.AutoCAD -c Release -f net48 -p:AutoCadNet48ApiVersion=24.3.0 -p:OutputPath=../../artifacts/autocad2024
      - name: Verify that AutoCAD SDK assemblies are not deployed
        shell: pwsh
        run: |
          $sdkFiles = Get-ChildItem src/AcadPaletteSetXData.AutoCAD/bin/Release -Recurse -Filter *.dll | Where-Object { $_.Name -notlike 'AcadPaletteSetXData.*' }
          if ($sdkFiles) { throw "Unexpected runtime assemblies: $($sdkFiles.Name -join ', ')" }
      - name: Build WPF verification tool for both runtimes
        run: dotnet build experiments/AcadPaletteSetXData.WpfSmoke -c Release
      - name: Verify and render the .NET 8 WPF editor
        # A modal message box left open by the smoke hangs the step: fail fast (a pass takes ~15 s).
        timeout-minutes: 5
        run: dotnet run --project experiments/AcadPaletteSetXData.WpfSmoke -c Release -f net8.0-windows --no-build -- artifacts/screenshots/net8
      - name: Verify and render the .NET Framework 4.8 WPF editor
        timeout-minutes: 5
        run: ./experiments/AcadPaletteSetXData.WpfSmoke/bin/Release/net48/AcadPaletteSetXData.WpfSmoke.exe artifacts/screenshots/net48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpf-renders
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-binaries
          path: src/AcadPaletteSetXData.AutoCAD/bin/Release
